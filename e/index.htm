function resizeWindow(){
var locIndex,bodyId
var i

	bodyId=unescape(String(ALL.BODY.location.href))
	locIndex=String(location.href)
	i=instr(locIndex,"body=")

	if (i>0) {locIndex=locIndex.substring(0,i-1);}

	bodyId=bodyId.substring(bodyId.lastIndexOf("/")+1,bodyId.lastIndexOf(".")) + ".htm"
	if (locIndex.lastIndexOf("?")>0) {locIndex+="&"} else {locIndex+="?"}
	document.location.href=locIndex + "body=" + bodyId
}
